name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/cache@v6
        with:
          path: .work/cache
          key: rclone-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npm ci
      - name: Generated files are up to date
        run: npm run gen && git diff --exit-code
      - run: npm run check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run check:package
