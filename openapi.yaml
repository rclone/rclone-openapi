    ServeListResponse:
      description: List of active `serve` instances, including their IDs, bind addresses, and parameters.
      content:
        application/json:
          schema:
            type: object
            properties:
              list:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Identifier returned by `serve/start`.
                    addr:
                      type: string
                      description: Address and port the server is listening on.
                    params:
                      type: object
                      required:
                        - id
                        - fs
                        - type
                      properties:
                        fs:
                          type: string
                        type:
                          type: string
                        opt:
                          type: object
                          additionalProperties: true
                        vfsOpt:
                          type: object
                          additionalProperties: true
                      additionalProperties: true
                      description: Serve configuration parameters supplied at startup.
                  additionalProperties: false
                  required:
                    - id
                    - addr
            required:
              - list
    ServeStartResponse:
      description: Confirmation of a newly started server, including ID and bound address.
      content:
        application/json:
          schema:
            type: object
            properties:
              addr:
                type: string
                description: Address and port the server is listening on.
              id:
                type: string
                description: Identifier to pass to `serve/stop`.
            required:
              - addr
              - id
    VfsForgetResponse:
      description: Paths evicted from the VFS directory cache.
      content:
        application/json:
          schema:
            type: object
            properties:
              forgotten:
                type: array
                items:
                  type: string
                description: Paths that were successfully forgotten.
            required:
              - forgotten
    VfsListResponse:
      description: Identifiers for the VFS instances currently in use.
      content:
        application/json:
          schema:
            type: object
            properties:
              vfses:
                type: array
                items:
                  type: string
                description: VFS name that can be used with other VFS endpoints.
            required:
              - vfses
    VfsPollIntervalResponse:
      description: Status of the poll-interval setting, possibly including the new interval.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    VfsQueueResponse:
      description: Upload queue entries for the selected VFS.
      content:
        application/json:
          schema:
            type: object
            properties:
              queued:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  description: Queued item metadata such as name, size, expiry, and upload state.
    VfsRefreshResponse:
      description: Acknowledgement of directories refreshed in the VFS cache.
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: object
                additionalProperties:
                  type: string
                description: Map of refreshed directories to status messages.
            required:
              - result
    VfsStatsResponse:
      description: Runtime statistics for a VFS, including disk cache and metadata cache state.
      content:
        application/json:
          schema:
            type: object
            properties:
              fs:
                type: string
                description: Name of the VFS.
              inUse:
                type: integer
                description: Number of active references to the VFS.
              diskCache:
                type:
                  - object
                  - "null"
                additionalProperties: true
                description: Disk cache metrics when caching is enabled.
              metadataCache:
                type: object
                additionalProperties:
                  type: integer
                description: In-memory metadata cache counters.
              opt:
                type: object
                additionalProperties: true
                description: Effective options applied to the VFS.
            required:
              - fs
              - inUse
              - metadataCache
              - opt
    PluginsctlGetPluginsForTypeResponse:
      description: Loaded plugin metadata for the requested MIME type.
      content:
        application/json:
          schema:
            type: object
            properties:
              loadedPlugins:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: true
                description: Installed plugins keyed by repository name.
              loadedTestPlugins:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: true
                description: Installed test plugins keyed by repository name.
            required:
              - loadedPlugins
              - loadedTestPlugins
    PluginsctlListPluginsResponse:
      description: Lists installed production and test plugins with their metadata.
      content:
        application/json:
          schema:
            type: object
            properties:
              loadedPlugins:
                type: array
                items:
                  type: object
                  additionalProperties: true
                description: Metadata entries for installed plugins.
              testPlugins:
                type: array
                items:
                  type: object
                  additionalProperties: true
                description: Metadata entries for installed test plugins.
            required:
              - loadedPlugins
              - testPlugins
    PluginsctlListTestPluginsResponse:
      description: Metadata for installed test plugins keyed by repository name.
      content:
        application/json:
          schema:
            type: object
            properties:
              loadedTestPlugins:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: true
                description: Installed test plugin metadata keyed by repository.
            required:
              - loadedTestPlugins
  schemas:
    RcError:
      type: object
      required:
        - error
        - status
        - path
        - input
      properties:
        error:
          type: string
        status:
          type: integer
        path:
          type: string
        input:
          type:
            - object
            - "null"
          additionalProperties: {}
          description: Original request parameters echoed for debugging.
    ConfigProvider:
      type: object
      properties:
        Aliases:
          type:
            - array
            - "null"
          items:
            type: string
        CommandHelp:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ConfigProviderCommandHelp"
        Description:
          type: string
        Hide:
          type: boolean
        MetadataInfo:
          anyOf:
            - $ref: "#/components/schemas/ConfigProviderMetadataInfo"
            - type: "null"
        Name:
          type: string
        Options:
          type: array
          items:
            $ref: "#/components/schemas/ConfigProviderOption"
        Prefix:
          type: string
      required:
        - Name
        - Description
        - Options
        - Prefix
      additionalProperties: true
    ConfigProviderCommandHelp:
      type: object
      properties:
        Long:
          type: string
        Name:
          type: string
        Opts:
          type:
            - object
            - "null"
          additionalProperties: true
        Short:
          type: string
      additionalProperties: true
    ConfigProviderMetadataInfo:
      type: object
      properties:
        Help:
          type: string
        System:
          type:
            - object
            - "null"
          additionalProperties:
            $ref: "#/components/schemas/ConfigProviderMetadataSystemEntry"
      additionalProperties: true
    ConfigProviderMetadataSystemEntry:
      type: object
      properties:
        Example:
          type: string
        Help:
          type: string
        ReadOnly:
          type: boolean
        Type:
          type: string
      additionalProperties: true
    OptionsInfoOptionExample:
      type: object
      properties:
        Value:
          type: string
        Help:
          type: string
      required:
        - Value
        - Help
      additionalProperties: true
    OptionsInfoOption:
      type: object
      properties:
        Name:
          type: string
        FieldName:
          type: string
        Help:
          type: string
        Default:
          description: Default value for this option.
          anyOf:
            - type: array
              items:
                type: string
            - type: boolean
            - type: number
            - type: string
            - type: object
              properties:
                Value:
                  type: boolean
                Valid:
                  type: boolean
              required:
                - Value
                - Valid
              additionalProperties: false
        Value:
          description: Current value of this option.
          anyOf:
            - type: array
              items:
                type: string
            - type: boolean
            - type: number
            - type: string
            - type: object
              properties:
                Value:
                  type: boolean
                Valid:
                  type: boolean
              required:
                - Value
                - Valid
              additionalProperties: false
            - type: "null"
        Hide:
          type: integer
        Required:
          type: boolean
        IsPassword:
          type: boolean
        NoPrefix:
          type: boolean
        Advanced:
          type: boolean
        Exclusive:
          type: boolean
        Sensitive:
          type: boolean
        DefaultStr:
          type: string
        ValueStr:
          type: string
        Type:
          type: string
        Groups:
          type: string
        ShortOpt:
          type: string
        Examples:
          type: array
          items:
            $ref: "#/components/schemas/OptionsInfoOptionExample"
      required:
        - Name
        - FieldName
        - Help
        - Default
        - Value
        - Hide
        - Required
        - IsPassword
        - NoPrefix
        - Advanced
        - Exclusive
        - Sensitive
        - DefaultStr
        - ValueStr
        - Type
      additionalProperties: true
    ConfigProviderOption:
      type: object
      properties:
        Advanced:
          type: boolean
        Default:
          $ref: "#/components/schemas/ConfigProviderOptionAny"
        DefaultStr:
          type: string
        Exclusive:
          type: boolean
        FieldName:
          type: string
        Help:
          type: string
        Hide:
          type: number
        IsPassword:
          type: boolean
        Name:
          type: string
        NoPrefix:
          type: boolean
        Required:
          type: boolean
        Sensitive:
          type: boolean
        Type:
          $ref: "#/components/schemas/ConfigProviderOptionType"
        Value:
          $ref: "#/components/schemas/ConfigProviderOptionAny"
        ValueStr:
          type: string
        Examples:
          type: array
          items:
            $ref: "#/components/schemas/ConfigProviderOptionExample"
        ShortOpt:
          type: string
        Provider:
          type: string
      additionalProperties: true
      required:
        - Name
        - FieldName
        - Help
        - Default
        - Value
        - Hide
        - Required
        - IsPassword
        - NoPrefix
        - Advanced
        - Exclusive
        - Sensitive
        - DefaultStr
        - ValueStr
        - Type
    ConfigProviderOptionExample:
      type: object
      properties:
        Help:
          type: string
        Value:
          type: string
        Provider:
          type: string
      additionalProperties: true
      required:
        - Help
        - Value
    ConfigProviderOptionAny:
      description: Arbitrary JSON value.
      anyOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items: {}
        - type: object
          additionalProperties: true
        - type: "null"
    ConfigProviderOptionType:
      type: string
      enum:
        - Bits
        - bool
        - CommaSepList
        - Duration
        - Encoding
        - int
        - mtime|atime|btime|ctime
        - SizeSuffix
        - SpaceSepList
        - string
        - stringArray
        - Time
        - Tristate
    CoreStatsTransfer:
      type: object
      description: Progress metrics for an in-flight transfer.
      properties:
        bytes:
          type: number
          description: Bytes transferred so far for this object.
        eta:
          type:
            - number
            - "null"
          description: Estimated seconds remaining, when available.
        group:
          type: string
          description: Stats group name associated with this transfer.
        name:
          type: string
          description: Remote path of the object being transferred.
        percentage:
          type: number
          description: Completion percentage from 0-100.
        size:
          type: number
          description: Total size in bytes of the object.
        speed:
          type: number
          description: Current transfer speed in bytes per second.
        speedAvg:
          type: number
          description: Current speed in bytes per second as an exponentially weighted moving average.
        srcFs:
          type: string
          description: Source remote or filesystem for this transfer.
        dstFs:
          type: string
          description: Destination remote or filesystem for this transfer.
        srcRemote:
          type: string
          description: Source path within srcFs.
        dstRemote:
          type: string
          description: Destination path within dstFs.
      additionalProperties: true
    CoreStatsChecking:
      type: object
      description: Metadata for an item currently undergoing verification.
      properties:
        group:
          type: string
          description: Stats group name associated with this verification.
        name:
          type: string
          description: Remote path of the object being verified.
        size:
          type: number
          description: Total size in bytes of the object.
      additionalProperties: true
    RemoteDefinition:
      type: object
      description: A remote defined inline. Needs `type` or `_name`. Other keys are backend options and must be strings.
      properties:
        type:
          type: string
          description: Backend type, such as `s3`.
        _name:
          type: string
          description: Name of a configured remote.
        _root:
          type: string
          description: Root path within the remote.
      additionalProperties:
        type: string
    RcGlobalOptions:
      type: object
      properties:
        _config:
          type: object
          additionalProperties: true
          description: Config overrides for this call only.
        _filter:
          type: object
          additionalProperties: true
          description: Filter overrides for this call only.
        _group:
          type: string
          description: Stats group for this call.
