components:
  parameters:
    PreferAsyncHeader:
      name: Prefer
      in: header
      description: Set to "respond-async" with _async=true to receive HTTP 202 instead of 200.
      schema:
        type: string
        enum:
          - respond-async
    GlobalGroupParam:
      name: _group
      in: query
      description: Assign the request to a custom stats group.
      schema:
        type: string
    Operations_UploadfilePostFsParam:
      name: fs
      in: query
      description: Remote name or path where the uploaded file should be stored.
      schema:
        type: string
      required: true
    Operations_UploadfilePostRemoteParam:
      name: remote
      in: query
      description: Destination path within `fs` for the uploaded file.
      schema:
        type: string
      required: true
    UploadfileConfigParam:
      name: _config
      in: query
      description: JSON encoded config overrides for this call only.
      schema:
        type: string
    UploadfileFilterParam:
      name: _filter
      in: query
      description: JSON encoded filter overrides for this call only.
      schema:
        type: string
  responses:
    RcError:
      description: Any error response (HTTP 4xx/5xx)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RcError"
    JobBatchResponse:
      description: Results of the batch job execution.
      content:
        application/json:
          schema:
            type: object
            properties:
