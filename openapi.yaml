    CoreTransferredResponse:
      description: Completed transfer records including size, status, and timestamps.
      content:
        application/json:
          schema:
            type: object
            properties:
              transferred:
                type: array
                items:
                  type: object
                  properties:
                    group:
                      type: string
                      description: Stats group identifier this transfer belonged to.
                    srcFs:
                      type: string
                      description: Source remote or filesystem used for the transfer.
                    dstFs:
                      type: string
                      description: Destination remote or filesystem used for the transfer.
                    srcRemote:
                      type: string
                      description: Source path within `srcFs`, when provided.
                    dstRemote:
                      type: string
                      description: Destination path within `dstFs`, when provided.
                    name:
                      type: string
                    size:
                      type: integer
                    bytes:
                      type: integer
                    checked:
                      type: boolean
                    what:
                      type: string
                      enum:
                        - transferring
                        - deleting
                        - checking
                        - importing
                        - hashing
                        - merging
                        - listing
                        - moving
                        - renaming
                    started_at:
                      type: string
                      description: ISO8601 timestamp when the transfer started.
                    completed_at:
                      type: string
                      description: ISO8601 timestamp when the transfer completed.
                    timestamp:
                      type: integer
                    error:
                      type: string
                    jobid:
                      type: integer
                  additionalProperties: true
                  required:
                    - group
                    - name
                    - size
                    - bytes
                    - checked
                    - what
                    - started_at
                    - completed_at
                    - error
            required:
              - transferred
